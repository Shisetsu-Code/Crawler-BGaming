name: Validate BGaming crawler

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install -r requirements.txt

      - name: Crawl live BGaming catalog
        run: python crawl_bgaming.py --no-thumbnails --output /tmp/bgaming

      - name: Validate targets
        shell: bash
        run: |
          test -s targets.txt
          if grep -Ev '^https://demo\.bgaming-network\.com/play/.+' targets.txt; then
            echo "targets.txt contiene URLs inesperadas"
            exit 1
          fi
          echo "targets=$(wc -l < targets.txt)"

      - name: Commit refreshed targets
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- targets.txt)" ]; then
            echo "targets.txt sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets.txt
          git commit -m "Update BGaming targets [skip ci]"
          git push
